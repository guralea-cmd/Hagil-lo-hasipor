<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>הצטרפות לקהילה | הגיל הוא לא הסיפור (סביבת בדיקה)</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="../css/style.css?v=92">
<style>
  .test-banner { background:#402; color:#fff; text-align:center; padding:8px; font-size:14px; }
  .auth-box { max-width:420px; margin:60px auto; }
  .auth-tabs { display:flex; gap:8px; margin-bottom:20px; }
  .auth-tabs button { flex:1; padding:10px; border:1px solid #ccc; background:#f5f5f5; border-radius:6px; cursor:pointer; font-family:inherit; font-size:15px; }
  .auth-tabs button.active { background:var(--color-primary,#a33); color:#fff; border-color:transparent; }
  .divider { text-align:center; margin:18px 0; color:#888; font-size:14px; }
  .google-btn { display:flex; align-items:center; justify-content:center; gap:10px; width:100%; padding:12px; border:1px solid #ccc; border-radius:6px; background:#fff; cursor:pointer; font-family:inherit; font-size:15px; }
  .google-btn img { width:20px; height:20px; }
</style>
<link rel="stylesheet" href="platform.css?v=2">
</head>
<body>

<div class="test-banner">
  <p>סביבת בדיקה - לא האתר החי - platform-test/join.html</p>
  <nav class="screen-nav" aria-label="מסכי הבדיקה">
    <a href="join.html" aria-current="page">1. הרשמה</a>
    <a href="profile-setup.html?demo=1">2. פרופיל</a>
    <a href="share-story.html">3. העלאת סיפור</a>
    <a href="admin-queue.html">4. תור האישור</a>
  </nav>
</div>

<div class="container auth-box">
  <h1 style="text-align:center;">הצטרפות לקהילה</h1>
  <p style="text-align:center;color:#555;">שלב 1: הרשמה. אחר כך תבנו פרופיל ותשתפו את הסיפור שלכם.</p>

  <div class="auth-tabs">
    <button type="button" id="tab-signup" class="active">הרשמה</button>
    <button type="button" id="tab-signin">כניסה</button>
  </div>

  <form id="auth-form">
    <div>
      <label for="email">אימייל</label>
      <input type="email" id="email" name="email" required>
    </div>
    <div>
      <label for="password">סיסמה</label>
      <input type="password" id="password" name="password" required minlength="6">
    </div>
    <button type="submit" class="btn" id="submit-btn" style="width:100%;">הרשמה עם אימייל</button>
    <p id="form-status" class="form-status" aria-live="polite"></p>
  </form>

  <div class="divider">או</div>

  <button type="button" class="google-btn" id="google-btn">
    <svg width="20" height="20" viewBox="0 0 48 48"><path fill="#FFC107" d="M43.611,20.083H42V20H24v8h11.303c-1.649,4.657-6.08,8-11.303,8c-6.627,0-12-5.373-12-12s5.373-12,12-12c3.059,0,5.842,1.154,7.961,3.039l5.657-5.657C34.046,6.053,29.268,4,24,4C12.955,4,4,12.955,4,24s8.955,20,20,20s20-8.955,20-20C44,22.659,43.862,21.35,43.611,20.083z"/><path fill="#FF3D00" d="M6.306,14.691l6.571,4.819C14.655,15.108,18.961,12,24,12c3.059,0,5.842,1.154,7.961,3.039l5.657-5.657C34.046,6.053,29.268,4,24,4C16.318,4,9.656,8.337,6.306,14.691z"/><path fill="#4CAF50" d="M24,44c5.166,0,9.86-1.977,13.409-5.192l-6.19-5.238C29.211,35.091,26.715,36,24,36c-5.202,0-9.619-3.317-11.283-7.946l-6.522,5.025C9.505,39.556,16.227,44,24,44z"/><path fill="#1976D2" d="M43.611,20.083H42V20H24v8h11.303c-0.792,2.237-2.231,4.166-4.087,5.571c0.001-0.001,0.002-0.001,0.003-0.002l6.19,5.238C36.971,39.205,44,34,44,24C44,22.659,43.862,21.35,43.611,20.083z"/></svg>
    <span>המשך עם גוגל</span>
  </button>

  <p id="auth-note" style="text-align:center;color:#888;font-size:13px;margin-top:24px;"></p>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-storage-compat.js"></script>
<script src="../js/firebase-config.js?v=4"></script>
<script src="join.js"></script>
</body>
</html>
