<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700;800&display=swap">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1350px; }
  body {
    font-family: "Assistant", "Segoe UI", Arial, sans-serif;
    background: #eee8e0;
    position: relative;
    overflow: hidden;
  }
  .top-band {
    background: #b83227;
    height: 165px;
    position: relative;
  }
  .wordmark {
    position: absolute; top: 0; left: 0; right: 0; height: 100%;
    display: flex; align-items: center; justify-content: center;
    color: #fff; font-size: 52px; font-weight: 800; white-space: nowrap; text-align: center;
  }
  .logo-badge {
    position: absolute; top: 50%; right: 36px; transform: translateY(-50%);
    width: 110px; height: 110px; border-radius: 50%;
    background: #b83227; border: 5px solid #ffb020;
    display: flex; align-items: center; justify-content: center;
    color: #fff; font-size: 84px; font-weight: 800;
  }
  .photo-area {
    position: absolute; top: 185px; left: 40px; right: 40px; height: 760px;
    border-radius: 18px; overflow: hidden; border: 10px solid #ffb020;
    box-shadow: 0 10px 30px rgba(0,0,0,0.25);
  }
  .photo-area img { width: 100%; height: 100%; object-fit: cover; object-position: center 20%; display: block; }
  .quote-area {
    position: absolute; top: 965px; left: 15px; right: 15px; text-align: center;
  }
  .quote-text {
    color: #181310; font-weight: 800;
    font-size: {{QUOTE_SIZE}}px;
    white-space: nowrap;
  }
  .name-pill { position: absolute; top: 1065px; left: 0; right: 0; text-align: center; }
  .name-pill span {
    display: inline-block; background: #ffb020; color: #181310; font-weight: 700;
    font-size: 36px; padding: 11px 32px; border-radius: 999px;
  }
  .bottom-band {
    position: absolute; bottom: 0; left: 0; right: 0; height: 165px;
    background: #b83227;
  }
  .bottom-cta {
    position: absolute; bottom: 0; left: 470px; right: 20px; height: 165px;
    display: flex; align-items: center; justify-content: center;
  }
  .bottom-cta span { color: #fff; font-size: 26px; font-weight: 800; white-space: nowrap; }
  .wa-badge {
    position: absolute; bottom: 82.5px; left: 36px; transform: translateY(50%);
    display: flex; align-items: center; gap: 14px; direction: ltr;
  }
  .wa-badge .circle {
    width: 110px; height: 110px; border-radius: 50%;
    background: #25d366; border: 5px solid #ffb020;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .wa-badge .circle svg { width: 60px; height: 60px; fill: #fff; }
  .wa-badge .number {
    color: #fff; font-weight: 800; font-size: 40px; white-space: nowrap;
    direction: ltr;
  }
</style>
</head>
<body>
  <div class="top-band">
    <div class="wordmark">הגיל הוא לא הסיפור</div>
    <div class="logo-badge">ה</div>
  </div>
  <div class="photo-area">
    <img src="data:image/jpeg;base64,{{PHOTO_BASE64}}">
  </div>
  <div class="quote-area">
    <div class="quote-text">"{{QUOTE}}"</div>
  </div>
  <div class="name-pill">
    <span>{{NAME}}, {{AGE}} · {{LOCATION}}</span>
  </div>
  <div class="bottom-band"></div>
  <div class="bottom-cta"><span>לסיפור המלא באתר guralea.com/stories.html</span></div>
  <div class="wa-badge">

</body>
</html>
