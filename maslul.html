<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>[טקסט זמני] השיחה שלך | הגיל הוא לא הסיפור</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;500;600;700;800&display=swap">
<style>
  :root{--bg:#eee8e0;--card:#fff;--primary:#b83227;--accent:#ffb020;--text:#181310;--muted:#3d3833;--border:#e6ddd3;--tint:#fbf5ee;--r:14px}
  html,body{margin:0;background:var(--bg);color:var(--text);font-family:"Assistant","Segoe UI",Arial,sans-serif;font-size:19px;line-height:1.5}
  .wrap{max-width:560px;margin:0 auto;padding:16px 16px 40px;box-sizing:border-box;min-height:100vh;display:flex;flex-direction:column}
  header{display:flex;align-items:center;gap:12px;padding:6px 0 14px}
  header img{width:48px;height:48px;border-radius:50%;object-fit:cover;background:#ddd}
  header .t{font-weight:700;font-size:21px}
  header .s{font-size:15px;color:var(--muted)}
  #thread{display:flex;flex-direction:column;gap:10px;flex:1}
  .msg{max-width:88%;padding:12px 16px;border-radius:18px;white-space:pre-wrap}
  .msg.assistant{background:var(--card);border:1px solid var(--border);align-self:flex-start;border-top-right-radius:6px}
  .msg.user{background:var(--primary);color:#fff;align-self:flex-end;border-top-left-radius:6px}
  #typing{align-self:flex-start;color:var(--muted);font-size:16px;padding:6px 16px}
  #choices{display:flex;flex-direction:column;gap:10px;margin-top:14px}
  .choice{font:inherit;font-weight:600;font-size:19px;padding:14px 18px;border-radius:var(--r);border:2px solid var(--primary);background:var(--card);color:var(--primary);text-align:right;cursor:pointer}
  .choice:active{background:var(--tint)}
  #free{display:flex;gap:8px;margin-top:14px}
  #free input{flex:1;font:inherit;font-size:19px;padding:12px 14px;border:2px solid var(--border);border-radius:var(--r);background:var(--card)}
  #free button,#lead-form button{font:inherit;font-weight:700;font-size:19px;padding:12px 20px;border:0;border-radius:var(--r);background:var(--primary);color:#fff;cursor:pointer}
  #lead{margin-top:16px;background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:16px}
  #lead label{display:block;font-weight:600;margin:10px 0 4px}
  #lead input{width:100%;box-sizing:border-box;font:inherit;font-size:19px;padding:12px 14px;border:2px solid var(--border);border-radius:var(--r)}
  #lead button{width:100%;margin-top:14px}
  #lead-status{margin-top:10px;font-weight:600;color:var(--primary)}
  [hidden]{display:none!important}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <img src="images/leah-avatar.jpg" alt="" onerror="this.style.visibility='hidden'">
    <div><div class="t">[טקסט זמני] שם המשפך</div><div class="s">[טקסט זמני] שורת הסבר קצרה - מה קורה כאן ולמה זה בשבילך</div></div>
  </header>
  <div id="thread"></div>
  <div id="typing" hidden>…</div>
  <div id="choices" hidden></div>
  <form id="free" hidden autocomplete="off">
    <input id="free-text" type="text" placeholder="[טקסט זמני] כתבי כאן" maxlength="600">
    <button type="submit">שלחי</button>
  </form>
  <div id="lead" hidden>
    <form id="lead-form">
      <label for="lead-name">שם מלא</label>
      <input id="lead-name" name="name" type="text" required>
      <label for="lead-phone">טלפון</label>
      <input id="lead-phone" name="phone" type="tel" required>
      <button type="submit">[טקסט זמני] שלאה תחזור אליי</button>
      <div id="lead-status"></div>
    </form>
  </div>
</div>
<script src="js/leads-sheet.js?v=1"></script>
<script src="js/maslul.js?v=1"></script>
</body>
</html>
