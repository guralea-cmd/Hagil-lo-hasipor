<section id="main-content">
  <div class="container">
    <h1>שתפו את הסיפור שלכם</h1>
    <p class="section-intro">העלו קצרצר וידאו (עד דקה-שתיים) וכמה מילים על הדרך שעשיתם. הסיפור יישלח לאישור לפני פרסום באתר.</p>

    <form id="story-form">
      <div>
        <label for="name">שם (כפי שיוצג באתר)</label>
        <input type="text" id="name" name="name" required>
      </div>
      <div>
        <label for="email">אימייל ליצירת קשר</label>
        <input type="email" id="email" name="email" required>
      </div>
      <div>
        <label for="bio">כמה מילים על עצמך ועל הדרך שעשית</label>
        <textarea id="bio" name="bio" rows="5" required></textarea>
      </div>
      <div>
        <label for="video">קובץ וידאו (עד 100MB)</label>
        <input type="file" id="video" name="video" accept="video/*" required>
        <p class="form-note" id="upload-progress" aria-live="polite"></p>
      </div>
      <button type="submit" class="btn">שליחת הסיפור</button>
      <p id="form-status" class="form-status" aria-live="polite"></p>
    </form>
  </div>
</section>

<footer>
  <p>הגיל הוא לא הסיפור © <span id="year"></span> לאה גורא | כל הזכויות שמורות</p>
