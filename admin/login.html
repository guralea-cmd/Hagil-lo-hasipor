<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>כניסת ניהול | הגיל הוא לא הסיפור</title>
<link rel="icon" href="../images/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="../css/style.css?v=35">
</head>
<body>

<div class="container">
  <div class="admin-login-box">
    <h1 style="text-align:center;margin-top:0;font-size:24px;">כניסת ניהול</h1>
    <form id="login-form">
      <div>
        <label for="email">אימייל</label>
        <input type="email" id="email" name="email" required>
      </div>
      <div>
        <label for="password">סיסמה</label>
        <input type="password" id="password" name="password" required>
      </div>
      <button type="submit" class="btn">כניסה</button>
      <p id="form-status" class="form-status" aria-live="polite"></p>
    </form>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-storage-compat.js"></script>
<script src="../js/firebase-config.js?v=2"></script>
<script src="login.js?v=1"></script>
</body>
</html>
