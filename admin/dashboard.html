<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>פאנל ניהול | הגיל הוא לא הסיפור</title>
<link rel="stylesheet" href="../css/style.css">
</head>
<body>

<header>
  <nav class="nav">
    <span class="logo">פאנל ניהול</span>
    <button id="logout-btn" class="btn btn-outline btn-sm">התנתקות</button>
  </nav>
</header>

<section>
  <div class="container">
    <h2>סיפורי קהילה לאישור</h2>
    <p class="section-intro">סיפורים שנשלחו על ידי חברי הקהילה. אשר/י לפני פרסום באתר.</p>
    <div style="overflow-x:auto;">
      <table class="admin-table">
        <thead>
          <tr>
            <th>תאריך</th>
            <th>שם</th>
            <th>טקסט</th>
            <th>וידאו</th>
            <th>אימייל</th>
            <th>סטטוס</th>
            <th>פעולות</th>
          </tr>
        </thead>
        <tbody id="stories-body">
          <tr><td colspan="7">טוען...</td></tr>
        </tbody>
      </table>
    </div>
  </div>
</section>

<section style="background:#fff;">
  <div class="container">
    <h2>נרשמים לסדנה</h2>
    <div style="overflow-x:auto;">
      <table class="admin-table">
        <thead>
          <tr>
            <th>תאריך</th>
            <th>שם</th>
            <th>טלפון</th>
            <th>אימייל</th>
            <th>הודעה</th>
          </tr>
        </thead>
        <tbody id="registrations-body">
          <tr><td colspan="5">טוען...</td></tr>
        </tbody>
      </table>
    </div>
  </div>
</section>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-storage-compat.js"></script>
<script src="../js/firebase-config.js"></script>
<script src="dashboard.js"></script>
</body>
</html>
