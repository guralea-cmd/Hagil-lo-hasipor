<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700;800&display=swap">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1350px; }
  body {
    font-family: "Assistant", "Segoe UI", Arial, sans-serif;
    background: #eee8e0;
    position: relative;
    overflow: hidden;
  }
  .top-band {
    background: #b83227;
    height: 190px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 20px;
  }
  .logo-badge {
    width: 88px; height: 88px; border-radius: 50%;
    background: #b83227; border: 4px solid #ffb020;
    display: flex; align-items: center; justify-content: center;
    color: #fff; font-size: 52px; font-weight: 800;
  }
  .wordmark { color: #fff; font-size: 46px; font-weight: 800; line-height: 1.15; text-align: right; }
  .photo-area {
    position: absolute; top: 240px; left: 60px; right: 60px; height: 780px;
    border-radius: 18px; overflow: hidden; border: 10px solid #ffb020;
    box-shadow: 0 10px 30px rgba(0,0,0,0.25);
  }
  .photo-area img { width: 100%; height: 100%; object-fit: cover; object-position: center 20%; display: block; }
  .caption-area { position: absolute; top: 1050px; left: 60px; right: 60px; text-align: center; }
  .caption-tag {
    display: inline-block; background: #ffb020; color: #181310; font-weight: 700;
    font-size: 26px; padding: 8px 22px; border-radius: 999px; margin-bottom: 22px;
  }
  .caption-main { color: #181310; font-size: 42px; font-weight: 800; line-height: 1.3; }
  .bottom-band {
    position: absolute; bottom: 0; left: 0; right: 0; height: 130px;
    background: #b83227; display: flex; align-items: center; justify-content: center;
  }
  .bottom-band span { color: #fff; font-size: 34px; font-weight: 700; }
</style>
</head>
<body>
  <div class="top-band">
    <div class="wordmark">הגיל הוא<br>לא הסיפור</div>
    <div class="logo-badge">ה</div>
  </div>
  <div class="photo-area">
    <img src="data:image/jpeg;base64,{{PHOTO_BASE64}}">
  </div>
  <div class="caption-area">
    <div class="caption-tag">נבחרת ההשראה</div>
    <div class="caption-main">{{NAME}}, {{AGE}}</div>
  </div>
  <div class="bottom-band"><span>guralea.com</span></div>
</body>
</html>
