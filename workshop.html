<section class="hero" id="main-content">
  <div class="container">
    <h1>הגיל הוא לא הסיפור, הסיפור הוא מה עושים איתו</h1>
    <p style="font-size:var(--text-lg);">איך לכווץ את הגיל הפיזיולוגי בכל גיל ומצב בריאותי</p>
  </div>

<section style="background:#fff;">
  <div class="container" style="max-width:520px;">
    <form id="workshop-lead-form">
      <div>
        <label for="workshop-first-name">שם פרטי</label>
        <input type="text" id="workshop-first-name" name="firstName" required>
      </div>
      <div>
        <label for="workshop-last-name">שם משפחה</label>
        <input type="text" id="workshop-last-name" name="lastName" required>
      </div>
      <div>
        <label for="workshop-email">אימייל</label>
        <input type="email" id="workshop-email" name="email" required>
      </div>
      <div>
        <label for="workshop-phone">טלפון</label>
        <input type="tel" id="workshop-phone" name="phone" required>
      </div>
      <button type="submit" class="btn">השארת פרטים</button>
      <p id="workshop-lead-status" class="form-status" aria-live="polite"></p>
    </form>
  </div>
</section>

<footer>
  <p>הגיל הוא לא הסיפור © <span id="year"></span> לאה גורא | כל הזכויות שמורות</p>
