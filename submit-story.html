</head>
<body>

<header>
  <nav class="nav">
    <a href="index.html" class="logo">הגיל הוא לא הסיפור</a>
    <button class="menu-toggle" aria-label="פתח תפריט">&#9776;</button>
    <ul class="nav-links">
      <li><a href="index.html">בית</a></li>
      <li><a href="about.html">קצת עליי</a></li>

      <li><a href="register.html">הרשמה</a></li>
    </ul>
  </nav>
</header>

<section>
  <div class="container">
    <h2>שתפו את הסיפור שלכם</h2>
    <p class="section-intro">העלו קצרצר וידאו (עד דקה-שתיים) וכמה מילים על הדרך שעשיתם. הסיפור יישלח לאישור לפני פרסום באתר.</p>

    <form id="story-form">
      <div>
        <label for="name">שם (כפי שיוצג באתר)</label>
        <input type="text" id="name" name="name" required>
      </div>
      <div>
        <label for="email">אימייל ליצירת קשר</label>
        <input type="email" id="email" name="email" required>
      </div>
      <div>
        <label for="bio">כמה מילים על עצמך ועל הדרך שעשית</label>
        <textarea id="bio" name="bio" rows="5" required></textarea>
      </div>
      <div>
        <label for="video">קובץ וידאו (עד 100MB)</label>
        <input type="file" id="video" name="video" accept="video/*" required>
        <p class="form-note" id="upload-progress"></p>
      </div>
      <button type="submit" class="btn">שליחת הסיפור</button>
      <p id="form-status" class="form-status"></p>
    </form>
  </div>
</section>

<footer>
  <p>הגיל הוא לא הסיפור © <span id="year"></span> | כל הזכויות שמורות</p>
</footer>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<script src="js/firebase-config.js"></script>
<script src="js/main.js"></script>
<script src="js/submit-story.js"></script>
<script>document.getElementById('year').textContent = new Date().getFullYear();</script>
</body>
</html>
